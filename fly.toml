# fly.toml — Fly.io configuration for Grabpic

app = "grabpic-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  FACE_MODEL = "buffalo_l"
  FACE_MATCH_TOLERANCE = "0.45"
  IMAGE_STORAGE_PATH = "/data/storage"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "grabpic_data"
  destination = "/data"
